name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'release tag must use vMAJOR.MINOR.PATCH semantic versioning\n' >&2
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf 'version=%s\nimage=%s\n' "$version" "$image" >>"$GITHUB_OUTPUT"

      - name: Build and push signed release candidate
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,mode=max,scope=release-amd64

      - name: Sign and verify image digest
        shell: bash
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$COSIGN_PRIVATE_KEY" || -z "$COSIGN_PASSWORD" ]]; then
            printf 'repository secrets COSIGN_PRIVATE_KEY and COSIGN_PASSWORD are required\n' >&2
            exit 1
          fi
          install -d release-assets
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"
          cosign public-key --key env://COSIGN_PRIVATE_KEY >release-assets/cosign.pub
          cosign verify --key release-assets/cosign.pub "$IMAGE@$DIGEST"

      - name: Generate release manifest
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          schema_target="$(find backend/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -E 's/^0*([0-9]+)_.*/\1/' | sort -n | tail -n 1)"
          [[ "$schema_target" =~ ^[0-9]+$ ]] || {
            printf 'could not determine schema target from backend/migrations\n' >&2
            exit 1
          }

          previous_tag="$(git tag --list 'v*.*.*' --sort=-v:refname \
            | grep -Fvx "$GITHUB_REF_NAME" | head -n 1 || true)"
          rollback_compatible_to="${previous_tag#v}"
          if [[ -z "$rollback_compatible_to" ]]; then
            rollback_compatible_to="$VERSION"
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg image "$IMAGE:$VERSION" \
            --arg image_digest "$DIGEST" \
            --argjson schema_target "$schema_target" \
            --arg rollback_compatible_to "$rollback_compatible_to" \
            --arg release_notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            '{
              version: $version,
              image: $image,
              image_digest: $image_digest,
              schema_target: $schema_target,
              schema_min_supported: 1,
              schema_max_supported: $schema_target,
              rollback_compatible_to: $rollback_compatible_to,
              requires_backup: true,
              destructive_migration: false,
              minimum_updater_version: "0.1.0",
              release_notes: $release_notes
            }' >release-assets/release-manifest.json

          jq -e '
            (.version | type == "string") and
            (.image | type == "string") and
            (.image_digest | test("^sha256:[0-9a-f]{64}$")) and
            (.schema_target | type == "number" and . >= 1) and
            (.schema_min_supported == 1) and
            (.schema_max_supported == .schema_target) and
            (.requires_backup == true)
          ' release-assets/release-manifest.json >/dev/null
          sha256sum release-assets/release-manifest.json release-assets/cosign.pub \
            >release-assets/checksums.txt

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/release-manifest.json
            release-assets/cosign.pub
            release-assets/checksums.txt
