name: 功能建议
description: 提议与项目定位一致的新能力
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述用户场景，而不是只描述实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与取舍
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已确认当前方案文档中没有等价能力。
          required: true
